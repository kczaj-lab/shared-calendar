<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Left sidebar: brand, user switcher, legend -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <span class="brand-name">Shared Calendar</span>
      </div>

      <section class="sidebar-section">
        <h2 class="section-label">Kim jestem?</h2>
        <div class="user-switcher" id="userSwitcher" role="radiogroup" aria-label="Wybierz użytkowniczkę"></div>
      </section>

      <section class="sidebar-section legend-section">
        <h2 class="section-label">Legenda</h2>
        <ul class="legend" id="legend"></ul>
      </section>
    </aside>

    <!-- Main: toolbar + weekly calendar -->
    <main class="main">
      <header class="toolbar">
        <div class="week-nav">
          <button class="icon-btn" id="prevWeek" aria-label="Poprzedni tydzień">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button class="btn btn-ghost" id="todayBtn">Dziś</button>
          <button class="icon-btn" id="nextWeek" aria-label="Następny tydzień">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <h1 class="week-range" id="weekRange"></h1>
        </div>
        <button class="btn btn-primary add-btn" id="addBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Dodaj zajęcie
        </button>
      </header>

      <!-- How-to + button opening the free-time panel (button: tablet/phone only) -->
      <section class="hint-card">
        <ol class="steps">
          <li><span class="step-no">1</span>Dodaj swoje zajęcia w kalendarzu</li>
          <li><span class="step-no">2</span>Sprawdź wspólne wolne terminy</li>
        </ol>
        <button class="btn free-toggle" id="freeToggle" aria-controls="freePanel" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Wspólne wolne terminy
          <span class="badge" id="freeCount">0</span>
        </button>
      </section>

      <!-- Mobile only: pick one day of the week -->
      <nav class="day-strip" id="dayStrip" aria-label="Wybierz dzień"></nav>

      <div class="calendar-card">
        <div class="calendar-scroll">
          <div class="calendar" id="calendar"></div>
        </div>
      </div>
    </main>

    <!-- Right panel: common free time -->
    <aside class="free-panel" id="freePanel" aria-label="Wspólne wolne terminy">
      <div class="panel-head">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Wspólne wolne terminy
        </h2>
        <button type="button" class="icon-btn panel-close" id="freeClose" aria-label="Zamknij">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="muted">Kiedy wszystkie trzy jesteście wolne</p>
      <div class="segmented" id="durationPicker" role="radiogroup" aria-label="Minimalny czas spotkania"></div>
      <div class="free-list" id="freeList"></div>
    </aside>
  </div>

  <div class="free-backdrop" id="freeBackdrop"></div>

  <button class="fab" id="fab" aria-label="Dodaj zajęcie">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Add / edit busy time -->
  <dialog class="sheet" id="entryDialog" aria-labelledby="entryTitle">
    <form id="entryForm" novalidate>
      <header class="sheet-head">
        <h2 id="entryTitle">Dodaj zajęcie</h2>
        <button type="button" class="icon-btn" id="closeDialog" aria-label="Zamknij">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="who" id="entryWho"></div>

      <label class="field">
        <span>Data</span>
        <input type="date" id="fDate" required>
      </label>
      <div class="field-row">
        <label class="field">
          <span>Od</span>
          <select id="fStart"></select>
        </label>
        <label class="field">
          <span>Do</span>
          <select id="fEnd"></select>
        </label>
      </div>
      <label class="field">
        <span>Opis <em>(opcjonalnie)</em></span>
        <input type="text" id="fNote" maxlength="80" placeholder="np. praca, siłownia" autocomplete="off">
      </label>

      <p class="form-error" id="formError" role="alert"></p>

      <footer class="sheet-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          <span>Usuń</span>
        </button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Anuluj</button>
        <button type="submit" class="btn btn-primary">Zapisz</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="availability.js"></script>
  <script src="app.js"></script>
</body>
</html>
